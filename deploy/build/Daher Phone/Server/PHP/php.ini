; Daher Phone - production PHP configuration.
; extension_dir is passed absolutely by the launcher (-d extension_dir=...).
extension=pdo_mysql
extension=mbstring
extension=curl
extension=openssl
extension=zip
extension=fileinfo

memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 300
display_errors = Off
log_errors = On
expose_php = Off
